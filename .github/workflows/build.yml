name: build

on:
  # 按用户要求暂时仅手动构建；本地验证及官网部署照常。/ Temporarily manual-only at the user’s request; local checks and website deployment remain enabled.
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    # 钉在 v6.1 发布点。release-v6.1 分支会继续演进，LCD LL 接口已经变过一次。
    # Pin to the v6.1 release. The release-v6.1 branch keeps moving; the LCD LL API already changed once.
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4

      # 先检查提交树的本地依赖，缺源/缺头直接给出路径，避免漫长编译后才暴露。
      # Check submitted local dependencies first, reporting missing paths before a long compile.
      - name: Verify committed source dependencies
        run: |
          python3 tools/check_build_sources.py --self-test
          python3 tools/check_build_sources.py

      # sdkconfig.defaults 里的 120MHz flash / PSRAM 依赖真机的 flash 型号，
      # CI 用 sdkconfig.ci 换成默认时序，只验证能不能编过。
      # The 120 MHz flash / PSRAM timing in sdkconfig.defaults needs the real
      # flash part; CI uses sdkconfig.ci (default timing) and only checks that it compiles.
      - name: build
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci set-target esp32s3
          idf.py -DSDKCONFIG_DEFAULTS=sdkconfig.ci build

      - name: size
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py size
